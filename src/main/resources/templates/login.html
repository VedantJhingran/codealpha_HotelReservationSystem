<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Welcome back')}"></head>
<body class="auth-page"><header th:replace="~{fragments :: nav}"></header><main class="auth-shell"><div class="auth-card"><div class="section-kicker">WELCOME BACK</div><h1>Return to your<br><em>better days.</em></h1><p class="lead-muted">Sign in to manage your stays and continue your journey.</p><form id="loginForm" class="luxury-form mt-4"><label>Email address<input type="email" id="loginEmail" required autocomplete="email"></label><label>Password<input type="password" id="loginPassword" required autocomplete="current-password"></label><button class="btn btn-gold w-100" type="submit">Sign in <i class="bi bi-arrow-right ms-2"></i></button><div id="loginMessage" class="small mt-3"></div></form><p class="auth-switch">New to Aurelia? <a href="/register">Create an account</a></p></div></main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js}" src="/js/app.js"></script><script th:src="@{/js/auth.js}" src="/js/auth.js"></script></body></html>
