<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create your account')}"></head>
<body class="auth-page"><header th:replace="~{fragments :: nav}"></header><main class="auth-shell"><div class="auth-card"><div class="section-kicker">A NEW CHAPTER</div><h1>Make room for<br><em>something special.</em></h1><p class="lead-muted">Create your Aurelia account and make every stay feel like coming home.</p><form id="registerForm" class="luxury-form mt-4"><label>Full name<input type="text" id="registerName" required maxlength="120"></label><label>Email address<input type="email" id="registerEmail" required maxlength="320"></label><label>Password<input type="password" id="registerPassword" required minlength="8" maxlength="72"></label><label>Phone number <span class="optional">(optional)</span><input type="tel" id="registerPhone" maxlength="30"></label><button class="btn btn-gold w-100" type="submit">Create account <i class="bi bi-arrow-right ms-2"></i></button><div id="registerMessage" class="small mt-3"></div></form><p class="auth-switch">Already a member? <a href="/login">Sign in</a></p></div></main><footer th:replace="~{fragments :: footer}"></footer><script th:src="@{/js/app.js}" src="/js/app.js"></script><script th:src="@{/js/auth.js}" src="/js/auth.js"></script></body></html>
