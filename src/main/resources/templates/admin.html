<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin dashboard')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <section class="page-hero compact">
        <div class="container">
            <div class="eyebrow">PRIVATE CONSOLE</div>
            <h1>Admin <em>dashboard.</em></h1>
            <p>Shape the Aurelia room collection.</p>
        </div>
    </section>
    <section class="section-pad">
        <div class="container">
            <div id="adminMessage" class="alert d-none"></div>
            <div class="row g-5">
                <div class="col-lg-4">
                    <div class="admin-panel">
                        <div class="section-kicker" id="roomFormKicker">NEW ROOM</div>
                        <h2 class="h2-serif" id="roomFormTitle">Add a room</h2>
                        <form id="roomForm" class="luxury-form mt-4">
                            <label>Room number<input id="adminRoomNumber" maxlength="20" required></label>
                            <label>Category<select id="adminCategory" required><option value="STANDARD">Standard</option><option value="DELUXE">Deluxe</option><option value="SUITE">Suite</option></select></label>
                            <label>Nightly rate<input id="adminRate" type="number" min="0.01" step="0.01" required></label>
                            <label>Capacity<input id="adminCapacity" type="number" min="1" required></label>
                            <button class="btn btn-gold w-100" id="roomFormSubmit" type="submit">Add to collection</button>
                            <button class="btn btn-link w-100 mt-2 d-none" id="roomFormCancel" type="button">Cancel edit</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div><div class="section-kicker">INVENTORY</div><h2 class="h2-serif mb-0">Active rooms</h2></div>
                    </div>
                    <div id="adminRoomList" class="admin-room-list"></div>
                </div>
            </div>
        </div>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js}" src="/js/app.js"></script>
<script th:src="@{/js/admin.js(v=4)}" src="/js/admin.js?v=4"></script>
</body>
</html>
