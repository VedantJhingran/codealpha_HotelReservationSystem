<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rooms & suites')}"></head>
<body><header th:replace="~{fragments :: nav}"></header>
<main>
    <section class="page-hero"><div class="container"><div class="eyebrow">YOUR PRIVATE RETREAT</div><h1>Rooms & <em>suites.</em></h1><p>Spaces designed around the way you want to feel.</p></div></section>
    <section class="section-pad pt-4"><div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-5">
            <div><div class="section-kicker">THE COLLECTION</div><h2 class="h2-serif mb-0">Find your room</h2></div>
            <div class="category-pills" id="categoryFilters"><button class="active" data-category="">All rooms</button><button data-category="STANDARD">Standard</button><button data-category="DELUXE">Deluxe</button><button data-category="SUITE">Suites</button></div>
        </div>
        <div id="roomGrid" class="row g-4"><div class="col-12 text-center py-5"><div class="spinner-border text-gold"></div></div></div>
        <div id="roomsMessage" class="alert d-none mt-4"></div>
    </div></section>
</main><footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/app.js}" src="/js/app.js"></script><script th:src="@{/js/rooms.js}" src="/js/rooms.js"></script>
</body></html>
