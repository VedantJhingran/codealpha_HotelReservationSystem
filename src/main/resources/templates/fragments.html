<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081b33">
    <title th:text="${title} + ' | Aurelia Hotels'">Aurelia Hotels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/site.css}" href="/css/site.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header th:fragment="nav" class="site-header">
    <div id="globalMessage" class="container position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1100;"></div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand brand-mark" href="/">
                <span class="brand-symbol">A</span>
                <span>Aurelia <small>HOTELS & RESORTS</small></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="/rooms">Stay</a></li>
                    <li class="nav-item"><a class="nav-link" href="/#experience">The Experience</a></li>
                    <li class="nav-item"><a class="nav-link" href="/bookings">My Bookings</a></li>
                    <li class="nav-item" id="adminNav" hidden><a class="nav-link" href="/admin">Admin</a></li>
                    <li class="nav-item nav-auth" id="guestNav">
                        <a class="btn btn-outline-gold btn-sm px-3" href="/login">Sign in</a>
                    </li>
                    <li class="nav-item dropdown" id="userNav" hidden>
                        <button class="nav-link dropdown-toggle border-0 bg-transparent" type="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="bi bi-person-circle me-1"></i><span id="navUserName">Guest</span></button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/bookings">My bookings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item" type="button" data-action="logout">Sign out</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<footer th:fragment="footer" class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
        <div><div class="brand-mark footer-brand"><span class="brand-symbol">A</span><span>Aurelia <small>HOTELS & RESORTS</small></span></div><p class="mb-0 mt-3 text-white-50">A considered stay, beautifully remembered.</p></div>
        <div class="footer-meta text-md-end"><span>© 2026 Aurelia Hotels</span><span>Privacy</span><span>Contact concierge</span></div>
    </div>
</footer>
</body>
</html>
