spring.application.name=hotelreservation

# Default local-development and test database.
spring.datasource.url=jdbc:h2:mem:hotelreservation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.h2.console.enabled=true

# Activate the MySQL profile with: --spring.profiles.active=mysql

HOTEL_ADMIN_PASSWORD_RESET=false
